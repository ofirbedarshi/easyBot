# Local: app + Flowise. Supabase stays cloud (project easybot).
# Usage: docker compose up flowise
# App still runs via npm start on the host (easier for local e2e).

services:
  flowise:
    image: flowiseai/flowise:1.8.3
    container_name: easybot-flowise
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Optional: point at Supabase Postgres for durable chatflows
      # DATABASE_TYPE: postgres
      # DATABASE_HOST: aws-1-<region>.pooler.supabase.com  # session pooler, not db.<ref>.supabase.co (IPv6-only)
      # DATABASE_PORT: "5432"
      # DATABASE_USER: postgres
      # DATABASE_PASSWORD: (set locally; do not commit)
      # DATABASE_NAME: postgres
      # DATABASE_SSL: "true"
